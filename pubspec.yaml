name: vatix
description: "Vatix — B2B ordering and ledger app for wholesalers and their retailers."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  get_it: ^9.2.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  easy_localization: ^3.0.8
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  cached_network_image: ^4.0.0
  shimmer: ^4.0.0

  # مثبّتان لكن غير مفعّلين في الـ MVP (Push يحتاج Cloud Functions = Blaze).
  flutter_local_notifications: ^22.3.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
